# strfry for the integration test: the production relay's settings, minus its
# write-policy plugin (the image has no Node). Binds on all interfaces so the test
# can reach it through Docker's port mapping.
db = "/tmp/"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
}

events {
    maxEventSize = 8192
    rejectEventsNewerThanSeconds = 86400
    rejectEventsOlderThanSeconds = 86400
}
